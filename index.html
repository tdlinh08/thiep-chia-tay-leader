<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ---------- Thư viện + dự phòng ---------- */
const FM = window.Motion || window.FramerMotion || {};
const STRIP = ["initial","animate","exit","transition","whileHover","whileTap","whileInView","layout","variants"];
const motion = FM.motion || new Proxy({}, { get: (_, tag) => React.forwardRef((props, ref) => {
  const p = { ...props }; STRIP.forEach(k => delete p[k]); return React.createElement(tag, { ...p, ref });
})});
const AnimatePresence = FM.AnimatePresence || (({ children }) => <>{children}</>);
const L = window.LucideReact || window.lucideReact || {};
const Ico = (n) => L[n] || (() => <span aria-hidden="true">•</span>);
const [Music, Volume2, VolumeX, Pencil, Sparkles, Send, Play, Pause, SkipForward, Zap, X, RotateCcw, Rocket] =
  ["Music","Volume2","VolumeX","Pencil","Sparkles","Send","Play","Pause","SkipForward","Zap","X","RotateCcw","Rocket"].map(Ico);
const COLORS = ["#FF3EA5","#23E1FF","#C8FF3D","#B9A2FF","#FFFFFF","#C0C8E0"];
const fire = (o) => { try { window.confetti && window.confetti({ colors: COLORS, ...o }); } catch (e) {} };

/* ---------- Âm thanh Web Audio ---------- */
const Sound = (() => {
  let ctx = null, master = null, muted = false;
  const ensure = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  const noise = (dur) => {
    const b = ctx.createBuffer(1, Math.max(1, ctx.sampleRate * dur), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b;
  };
  const tone = (type, f0, f1, dur, vol = .25, at = 0, dest) => {
    const t = (at > 1000 ? at : ctx.currentTime + at), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05);
  };
  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* Nhạc nền eurodance tự tổng hợp */
  let playing = false, timer = null, nextTime = 0, step = 0, track = 0, bus = null;
  const TRACKS = [
    { bpm: 128, root: 57 }, { bpm: 122, root: 60 }, { bpm: 132, root: 55 }, { bpm: 118, root: 62 }, { bpm: 126, root: 53 },
  ];
  const PROG = [[9, 0], [5, 0], [0, 0], [7, 0]]; // vi IV I V
  const LEAD = [12, null, 14, null, 16, 16, null, 19, 16, null, 14, 12, null, 14, null, null];
  const scheduleStep = (s, t) => {
    const tr = TRACKS[track], sixteenth = 60 / tr.bpm / 4;
    const bar = Math.floor(s / 16) % 4, pos = s % 16, ch = PROG[bar][0], root = tr.root + ch;
    if (pos % 4 === 0) { // kick
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .12);
      g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + .2);
    }
    if (pos % 4 === 2) { // hi-hat
      const n = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
      n.buffer = noise(.05); hp.type = "highpass"; hp.frequency.value = 7000;
      g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05);
      n.connect(hp); hp.connect(g); g.connect(bus); n.start(t);
    }
    if (pos % 4 === 2 || pos % 4 === 3) { // bass nảy offbeat
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = midi(root - 24); f.type = "lowpass"; f.frequency.value = 700;
      g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.0001, t + sixteenth * .9);
      o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + sixteenth);
    }
    const minor = ch === 9; // hợp âm vi là thứ
    const triad = [0, minor ? 3 : 4, 7, 12];
    tone("square", midi(root + triad[pos % 4]), null, sixteenth * .8, .045, t, bus); // arpeggio
    const l = LEAD[pos];
    if (l !== null && Math.floor(s / 64) % 2 === 1) tone("triangle", midi(tr.root + l), null, sixteenth * 1.7, .09, t, bus);
  };
  const tick = () => {
    if (!playing) return;
    const sixteenth = 60 / TRACKS[track].bpm / 4;
    while (nextTime < ctx.currentTime + .15) { scheduleStep(step, nextTime); nextTime += sixteenth; step++; }
    timer = setTimeout(tick, 40);
  };

  return {
    unlock: () => ensure(),
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : .55; },
    startup() { // tiếng khởi động kiểu máy tính năm 2000
      if (!ensure() || muted) return;
      [[64, 0], [71, .12], [76, .24], [80, .36], [83, .5]].forEach(([n, d]) => tone("sine", midi(n), null, 1.6, .12, d));
      [[52, 0], [59, .1]].forEach(([n, d]) => tone("triangle", midi(n), null, 1.8, .1, d));
    },
    ding() { if (ensure() && !muted) { tone("triangle", 988, null, .25, .22); tone("triangle", 1319, null, .5, .2, .12); } },
    blip() { if (ensure() && !muted) tone("square", 880, 1320, .07, .1); },
    sparkle() {
      if (!ensure() || muted) return;
      [0, .05, .1, .16].forEach((d, i) => tone("sine", 1800 + Math.random() * 1600, null, .18, .08, d + i * .01));
    },
    zap() { if (ensure() && !muted) { tone("sawtooth", 1200, 90, .25, .16); tone("square", 300, 1400, .18, .07, .05); } },
    buzz() {
      if (!ensure() || muted) return;
      const t = ctx.currentTime, o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = 110; lfo.frequency.value = 30; lg.gain.value = 50;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .6);
      o.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + .65); lfo.stop(t + .65);
    },
    tada() {
      if (!ensure() || muted) return;
      [[72, 0], [76, .09], [79, .18], [84, .3]].forEach(([n, d]) => { tone("square", midi(n), null, .5, .07, d); tone("triangle", midi(n), null, .7, .12, d); });
    },
    play(i) {
      if (!ensure()) return;
      track = i; if (playing) return;
      bus = ctx.createGain(); bus.gain.value = .5; bus.connect(master);
      playing = true; nextTime = ctx.currentTime + .05; step = 0; tick();
    },
    setTrack(i) { track = i; step = 0; },
    stop() { playing = false; clearTimeout(timer); if (bus) { try { bus.gain.setTargetAtTime(0, ctx.currentTime, .05); } catch (e) {} } },
  };
})();

/* ---------- Nội dung ---------- */
const TRACKS = [
  { title: "Bye Bye Deadline (Remix 2000)", len: "3:41" },
  { title: "Out Of Office Forever", len: "4:02" },
  { title: "Tạm Biệt Cái Ghế Xoay", len: "3:18" },
  { title: "Lương Mới Lên Level", len: "3:55" },
  { title: "Nhớ Nhóm Chat Nha", len: "4:20" },

const FORTUNES = [

  "Wifi công ty mới mạnh gấp đôi. Họp online không bao giờ bị đứng hình.",

  "Đồng nghiệp mới rất dễ thương, nhưng chắc chắn không lầy bằng tụi mình.",

const INSTALL_STEPS = [

  "Đang xoá deadline_cu_FINAL_v9_banchot.docx…",
  "Đang sao lưu kỷ niệm với team vào bộ nhớ vĩnh viễn…",

  { from: "Cái ghế xoay của HP", text: "Không ai xoay em đẹp như chị. Em sẽ đứng yên tưởng niệm.", c: "var(--lilac)" },
  { from: "Máy pha cà phê", text: "Mất một khách hàng trung thành nhất. Doanh số tháng này chắc giảm 40%.", c: "var(--cyan)" },
  { from: "Nhóm chat của team", text: "Không được rời nhóm đâu nha. Rời là tụi mình add lại liền.", c: "var(--lime)" },
  { from: "Cây xanh trên bàn", text: "Ai sẽ tưới em đây? Nhớ quay lại thăm em nha.", c: "#FFC6EC" },
];
const STICKERS = [
  { text: "BYE BYE ✦", bg: "var(--hot)", light: true, rot: -5 },
  { text: "LƯƠNG X2", bg: "var(--lime)", rot: 4 },
  { text: "OUT OF OFFICE FOREVER", bg: "#fff", rot: -2 },
  { text: "NHỚ TỤI MÌNH NHA", bg: "var(--cyan)", rot: 3 },
  { text: "SẾP MỚI MAY MẮN QUÁ", bg: "var(--lilac)", rot: -3 },
  { text: "CỨ BAY ĐI ★", bg: "holo", rot: 5 },
  { text: "CẤM RỜI NHÓM CHAT", bg: "var(--hot)", light: true, rot: -4 },
  { text: "LEVEL UP!", bg: "var(--lime)", rot: 2 },
];
const AVATARS = ["🦋", "💿", "⭐", "📟", "💾", "🌈", "🎧", "👾"];
const DEFAULT = {
  name: "Hà Phương", company: "Công ty mới", from: "Cả team",
  wish: "Chúc Hà Phương ở công ty mới lương cao hơn, sếp dễ hơn, deadline nhẹ hơn và đồng nghiệp dễ thương (nhưng không bằng tụi mình đâu). Cảm ơn HP vì những ngày cùng team cày dự án, cùng cười, cùng ăn vặt lúc 4 giờ chiều. Bay cao lên nha, có dịp nhớ quay về khao trà sữa!",
  avatar: 0, photo: "",
};
const KEY = "thiep-ha-phuong-y2k", KEY_MSG = "thiep-ha-phuong-y2k-msgs";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const pick = (a, not) => { let x; do { x = a[Math.floor(Math.random() * a.length)]; } while (a.length > 1 && x === not); return x; };

/* ---------- Thành phần trang trí ---------- */
function Butterfly({ color = "#FF3EA5", size = 46, style, className = "" }) {
  return (
    <div className={`drift absolute pointer-events-none ${className}`} style={style} aria-hidden="true">
      <svg width={size} height={size} viewBox="0 0 60 60" className="flap">
        <path d="M30 30 C18 6 2 10 6 24 C9 33 20 32 30 30 Z" fill={color} stroke="#1B1446" strokeWidth="2.5" />
        <path d="M30 30 C42 6 58 10 54 24 C51 33 40 32 30 30 Z" fill={color} stroke="#1B1446" strokeWidth="2.5" />
        <path d="M30 30 C20 36 12 48 20 52 C26 54 29 42 30 30 Z" fill="#fff" stroke="#1B1446" strokeWidth="2.5" />
        <path d="M30 30 C40 36 48 48 40 52 C34 54 31 42 30 30 Z" fill="#fff" stroke="#1B1446" strokeWidth="2.5" />

      </svg>

}
function Star({ style, color = "#fff", size = 22 }) {
  return (
    <svg className="twinkle absolute pointer-events-none" style={style} width={size} height={size} viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z" fill={color} stroke="#1B1446" strokeWidth="1.4" />
    </svg>
  );
}
function Win({ title, children, className = "", bar, delay = 0 }) {
  return (
    <motion.section initial={{ y: 30, opacity: 0, scale: .96 }} animate={{ y: 0, opacity: 1, scale: 1 }}
      transition={{ type: "spring", stiffness: 160, damping: 16, delay }} className={`win ${className}`} aria-label={title}>
      <div className="win-bar" style={bar ? { background: bar } : undefined}>
        <span className="dot" style={{ background: "#FF6B9A" }} />
        <span className="dot" style={{ background: "#FFE14D" }} />

/* ---------- Trình cài đặt sự nghiệp ---------- */
function Installer({ name, company }) {
  const [pct, setPct] = useState(0);
  const [state, setState] = useState("idle");
  const [msg, setMsg] = useState("Sẵn sàng cài đặt phiên bản mới.");
  const t = useRef();
  const run = () => {
    Sound.blip(); setState("run"); setPct(0);
    let p = 0;
    const go = () => {
      p = Math.min(100, p + 3 + Math.random() * 11);
      if (p > 86 && p < 100 && Math.random() < .35) p = Math.min(p, 99); // kẹt ở 99% như thật
      setPct(p);
      setMsg(INSTALL_STEPS[Math.min(INSTALL_STEPS.length - 1, Math.floor(p / (100 / INSTALL_STEPS.length)))]);
      if (p >= 100) {
        setState("done"); setMsg(`Hoàn tất! ${name} 2.0 đã chạy ổn định tại ${company}.`);
        Sound.tada(); fire({ particleCount: 110, spread: 80, origin: { y: .5 }, shapes: ["star", "circle"] });
      } else t.current = setTimeout(go, 260 + Math.random() * 380);
    };
    go();
  };
  useEffect(() => () => clearTimeout(t.current), []);
  const blocks = 20, filled = Math.round(pct / 100 * blocks);
  return (
    <div className="p-4 sm:p-5 flex flex-col gap-4">
      <div className="flex items-start gap-3">
        <div className="w-12 h-12 shrink-0 rounded-xl border-[2.5px] border-[#1B1446] grid place-items-center holo-chip"><Rocket size={24} strokeWidth={2.5} color="#1B1446" /></div>
        <div className="min-w-0">
          <div className="font-bold text-lg leading-tight">Trình cài đặt: {name} 2.0</div>
          <div className="text-sm opacity-75">Đích đến: <b>{company}</b> · Dung lượng: vô hạn tiềm năng</div>
        </div>
      </div>
      <div className="rounded-lg border-[2.5px] border-[#1B1446] bg-white p-1 flex gap-[3px]" role="progressbar" aria-valuenow={Math.round(pct)} aria-valuemin={0} aria-valuemax={100} aria-label="Tiến độ cài đặt">
        {Array.from({ length: blocks }, (_, i) => (
          <span key={i} className="h-5 flex-1 rounded-[3px] transition-colors duration-200"
            style={{ background: i < filled ? (i % 2 ? "var(--cyan)" : "#3D7BFF") : "#E6E9F4" }} />
        ))}
      </div>
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <p className="pixel text-xl leading-tight min-h-[2.5em] flex-1 min-w-0" aria-live="polite">{msg}</p>
        <span className="pixel text-3xl" style={{ fontVariantNumeric: "tabular-nums" }}>{Math.floor(pct)}%</span>
      </div>
      <div className="flex gap-3 flex-wrap">
        {state !== "run" && (
          <button type="button" onClick={run} className={`btn ${state === "done" ? "" : "btn-cyan"} px-5 py-2.5 text-base flex items-center gap-2`}>
            {state === "done" ? <><RotateCcw size={18} strokeWidth={3} /> CÀI LẠI CHO VUI</> : <><Zap size={18} strokeWidth={3} /> CÀI ĐẶT SỰ NGHIỆP MỚI</>}
          </button>
        )}
        {state === "run" && <span className="pixel text-xl opacity-70">Vui lòng không tắt máy. Cũng đừng nghỉ việc lần nữa.</span>}
      </div>
    </div>
  );
}

/* ---------- Vệt lấp lánh theo con trỏ ---------- */
function useSparkleTrail() {
  useEffect(() => {
    if (!window.matchMedia || !matchMedia("(pointer: fine)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let last = 0;
    const glyphs = ["✦", "✧", "★", "✩"], cols = ["#FF3EA5", "#23E1FF", "#9C7BFF", "#7BC800"];
    const move = (e) => {
      const now = performance.now(); if (now - last < 45) return; last = now;
      const s = document.createElement("span");
      s.className = "spark"; s.textContent = glyphs[Math.floor(Math.random() * 4)];
      s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px"; s.style.color = cols[Math.floor(Math.random() * 4)];
      document.body.appendChild(s);
      requestAnimationFrame(() => { s.style.transform = `translate(${(Math.random() - .5) * 30}px, ${18 + Math.random() * 20}px) scale(.4)`; s.style.opacity = "0"; });
      setTimeout(() => s.remove(), 720);
    };
    window.addEventListener("pointermove", move);
    return () => window.removeEventListener("pointermove", move);
  }, []);
}

      <div className="sticky z-40 flex justify-end gap-2 flex-wrap" style={{ top: "calc(8px + env(safe-area-inset-top, 0px))" }}>
        <button type="button" onClick={togglePlay} className={`btn ${playing ? "btn-lime" : ""} px-3 py-2 flex items-center gap-1.5 text-sm`} aria-pressed={playing}>
          <Music size={17} strokeWidth={3} /> {playing ? "TẮT NHẠC" : "BẬT NHẠC"}
        </button>
        <button type="button" onClick={toggleMute} className={`btn ${muted ? "btn-hot" : ""} p-2.5`} aria-label={muted ? "Bật tiếng" : "Tắt tiếng"}>
          {muted ? <VolumeX size={19} strokeWidth={3} /> : <Volume2 size={19} strokeWidth={3} />}
        </button>
        <button type="button" onClick={() => { Sound.blip(); setDrawer(true); }} className="btn btn-cyan px-3 py-2 flex items-center gap-1.5 text-sm">
          <Pencil size={17} strokeWidth={3} /> SỬA THIỆP
        </button>
      </div>

      <div className="mx-auto max-w-5xl flex flex-col gap-6 mt-4">
        {/* Dải chữ chạy */}
        <div className="rounded-full border-[2.5px] border-[#1B1446] overflow-hidden py-1" style={{ background: "#0E1A3A", boxShadow: "4px 4px 0 #1B1446" }} aria-hidden="true">
          <div className="marquee whitespace-nowrap pixel text-2xl text-[var(--lime)] flex w-max">
            {[0, 1].map(k => (
              <span key={k} className="pr-10">
                ✦ OUT OF OFFICE: VĨNH VIỄN ✦ ĐANG CHUYỂN SANG: {cfg.company.toUpperCase()} ✦ TRẠNG THÁI: ĐI LÀM GIÀU ✦ ĐỪNG RỜI NHÓM CHAT ✦ OUT OF OFFICE: VĨNH VIỄN ✦ ĐANG CHUYỂN SANG: {cfg.company.toUpperCase()} ✦ TRẠNG THÁI: ĐI LÀM GIÀU ✦ ĐỪNG RỜI NHÓM CHAT
              </span>
            ))}
          </div>
        </div>

        {/* Tiêu đề */}
        <header className="relative text-center px-2 pt-6 pb-4">
          <Butterfly color="#FF3EA5" style={{ left: "2%", top: 0 }} />
          <Butterfly color="#23E1FF" size={38} style={{ right: "4%", top: 18, animationDelay: "1.2s" }} />
          <Butterfly color="#C8FF3D" size={30} style={{ right: "18%", bottom: -10, animationDelay: ".6s" }} className="hidden sm:block" />
          <Star style={{ left: "16%", top: 70 }} color="#C8FF3D" />
          <Star style={{ right: "12%", top: 96, animationDelay: ".7s" }} size={28} />
          <Star style={{ left: "8%", bottom: 6, animationDelay: "1.1s" }} color="#23E1FF" size={18} />
          <motion.p initial={{ opacity: 0, y: -10 }} animate={{ opacity: 1, y: 0 }} className="pixel text-2xl sm:text-3xl">~*~ một tấm thiệp gửi từ năm 2000 ~*~</motion.p>
          <motion.h1 initial={{ scale: .6, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} transition={{ type: "spring", stiffness: 180, damping: 12 }}
            className="chrome text-[clamp(44px,10vw,104px)] mt-2">TẠM BIỆT<br />{cfg.name.toUpperCase()}</motion.h1>
          <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: .3 }}
            className="inline-flex items-center gap-2 mt-5 rounded-full border-[2.5px] border-[#1B1446] px-4 py-1.5 holo-chip font-bold" style={{ boxShadow: "3px 3px 0 #1B1446" }}>
            <Rocket size={18} strokeWidth={2.5} /> Chúc HP lên level tại <span className="text-[#C4127A]">{cfg.company}</span>
          </motion.div>
        </header>

        <div className="grid md:grid-cols-[1fr_1.15fr] gap-6 items-start">
          {/* Hồ sơ MSN */}
          <Win title={`${cfg.name} — Hồ sơ Messenger`} delay={.1}>
            <div className="p-4 sm:p-5 flex flex-col gap-4">
              <div className="flex items-center gap-4">
                <div className="relative shrink-0 w-24 h-24 rounded-2xl border-[2.5px] border-[#1B1446] overflow-hidden grid place-items-center text-5xl holo-chip" style={{ boxShadow: "3px 3px 0 #1B1446" }}>
                  {cfg.photo ? <img src={cfg.photo} alt={`Ảnh của ${cfg.name}`} className="w-full h-full object-cover" /> : <span aria-hidden="true">{avatar}</span>}
                </div>
                <div className="min-w-0">
                  <div className="display text-xl leading-tight break-words">{cfg.name}</div>
                  <div className="pixel text-xl leading-tight flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-[#7BD000] border-2 border-[#1B1446] inline-block" /> Trực tuyến · ở nơi khác</div>
                  <div className="text-sm font-semibold opacity-75 mt-0.5">Tâm trạng: ✦ sắp giàu ✦</div>
                </div>
              </div>
              <div className="rounded-xl border-2 border-[#1B1446] bg-[var(--mist)] p-3 text-sm font-semibold leading-relaxed">
                <div className="pixel text-lg opacity-70 leading-none mb-1">Thông tin chuyển việc</div>
                Nơi làm cũ: <b>Team mình</b> (đang khóc)<br />
                Nơi làm mới: <b>{cfg.company}</b><br />
                Thời gian bàn giao còn lại: <b>00:00:00</b>
              </div>
              <button type="button" onClick={buzz} className="btn btn-lime px-4 py-2.5 text-base flex items-center justify-center gap-2">
                <Zap size={18} strokeWidth={3} /> GỬI BUZZ! CHO {cfg.name.toUpperCase()}
              </button>
            </div>
          </Win>

          {/* Lời chúc */}
          <Win title="loi_chuc_tu_team.txt" delay={.18} bar="linear-gradient(90deg, #3D7BFF, #C77DFF 55%, #FF3EA5)">
            <div className="p-5 sm:p-6 flex flex-col gap-4">
              <p className="text-lg sm:text-xl font-semibold leading-relaxed" style={{ maxWidth: "62ch" }}>{cfg.wish}</p>
              <p className="self-end pixel text-2xl">— {cfg.from} ♥</p>
            </div>
          </Win>
        </div>

        <div className="grid md:grid-cols-2 gap-6 items-start">
          <Win title="CaiDatSuNghiep.exe" delay={.24}><Installer name={cfg.name} company={cfg.company} /></Win>
          <Win title="Quả cầu tiên tri" delay={.3} bar="linear-gradient(90deg, #7B4BFF, #C77DFF 50%, #23E1FF)"><CrystalBall company={cfg.company} /></Win>
        </div>

        <div className="grid md:grid-cols-[1.15fr_1fr] gap-6 items-start">
          <Win title="Đĩa mixtape tạm biệt — Winamp 2000" delay={.36} bar="linear-gradient(90deg, #0E1A3A, #3D7BFF 60%, #23E1FF)">
            <Mixtape playing={playing} track={track} onToggle={togglePlay} onTrack={chooseTrack} />
          </Win>
          <Win title="Sổ lưu bút — Cuộc trò chuyện" delay={.42}><Guestbook /></Win>
        </div>

        {/* Sticker */}
        <section aria-label="Sticker" className="flex flex-col gap-4">
          <div className="flex items-end justify-between gap-3 flex-wrap">
            <h2 className="chrome text-[clamp(28px,5vw,44px)]">STICKER Y2K</h2>
            <span className="pixel text-2xl rounded-full border-[2.5px] border-[#1B1446] bg-white px-3" style={{ fontVariantNumeric: "tabular-nums" }}>
              ĐỘ NHỚ HP: {hits} {hits >= 20 ? "· MAX LEVEL" : hits >= 8 ? "· NHỚ LẮM RỒI" : ""}
            </span>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            {STICKERS.map((s, i) => <Sticker key={s.text} s={s} i={i} onHit={() => setHits(h => h + 1)} />)}
          </div>
        </section>

        <div className="flex justify-center pt-2">
          <motion.button type="button" onClick={fly} whileHover={{ scale: 1.05 }} whileTap={{ scale: .92 }}
            animate={{ y: [0, -6, 0] }} transition={{ y: { duration: 1.4, repeat: Infinity } }}
            className="btn btn-hot px-8 py-4 text-2xl sm:text-3xl flex items-center gap-3">
            <Sparkles size={30} strokeWidth={2.5} /> BAY LÊN NÀO!
          </motion.button>
        </div>

        <p className="text-center pixel text-xl opacity-75">Thiệp được tối ưu cho Internet Explorer 6, độ phân giải 800×600. Đùa thôi, xem trên điện thoại cũng đẹp.</p>
      </div>

      <AnimatePresence>
        {toast && (
          <motion.div key={toast} initial={{ y: 80, opacity: 0, x: "-50%" }} animate={{ y: 0, opacity: 1, x: "-50%" }} exit={{ y: 80, opacity: 0, x: "-50%" }}
            className="fixed left-1/2 z-50 win w-[min(92vw,440px)]" style={{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }} role="status">
            <div className="win-bar"><span className="dot" style={{ background: "var(--lime)" }} /><span className="t">Thông báo</span></div>
            <div className="px-4 py-2.5 font-bold">{toast}</div>
          </motion.div>
        )}
      </AnimatePresence>

      <Customizer open={drawer} onClose={() => setDrawer(false)} cfg={cfg} setCfg={setCfg} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
